<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Charging Bypass</title>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #252525;
  --primary: #4caf50;
  --primary-dark: #388e3c;
  --accent: #ff9800;
  --danger: #f44336;
  --text: #e0e0e0;
  --text2: #888;
  --border: #2a2a2a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'Roboto', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
  max-width: 480px;
  margin: 0 auto;
  -webkit-user-select: none;
  user-select: none;
  padding-bottom: 32px;
}
.header { text-align: center; padding: 20px 0 12px; }
.header h1 { font-size: 22px; font-weight: 600; }
.header .sub { color: var(--text2); font-size: 13px; margin-top: 2px; }

.lang-sw {
  position: absolute; top: 16px; right: 16px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 10px; font-size: 12px;
  color: var(--text2); cursor: pointer; outline: none;
}

.sbar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; background: var(--surface); border-radius: 10px;
  margin-bottom: 14px; font-size: 13px; color: var(--text2);
}
.sdot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--primary); flex-shrink: 0;
  animation: pulse 2s infinite;
}
.sdot.err { background: var(--danger); animation: none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.card {
  background: var(--surface); border-radius: 14px;
  padding: 18px; margin-bottom: 14px;
}
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sitem {
  background: var(--surface2); border-radius: 10px;
  padding: 14px; text-align: center;
}
.sitem .val { font-size: 26px; font-weight: 700; margin-bottom: 2px; }
.sitem .lbl {
  font-size: 11px; color: var(--text2);
  text-transform: uppercase; letter-spacing: .5px;
}
.sitem.st-charging .val { color: var(--primary); }
.sitem.st-discharging .val { color: var(--text2); }
.sitem.st-stopped .val { color: var(--accent); }
.sitem.st-bypass .val { color: var(--danger); }

.bbar {
  width: 100%; height: 10px; background: var(--surface2);
  border-radius: 5px; margin-top: 12px; overflow: hidden;
}
.bfill { height: 100%; border-radius: 5px; transition: width .6s, background .6s; }
.markers { position: relative; height: 20px; margin-top: 4px; }
.mk {
  position: absolute; top: 0; width: 2px; height: 10px;
  transform: translateX(-50%);
}
.mk.start { background: var(--primary); }
.mk.stop { background: var(--accent); }
.mk span {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: var(--text2); white-space: nowrap;
}

.srow {
  display: flex; justify-content: space-between;
  align-items: center; padding: 10px 0;
}
.srow + .srow { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 14px; }
.srow h3 { font-size: 15px; font-weight: 500; margin-bottom: 1px; }
.srow p { font-size: 12px; color: var(--text2); }

.tog { position: relative; width: 50px; height: 26px; flex-shrink: 0; }
.tog input { opacity: 0; width: 0; height: 0; }
.tog .sl {
  position: absolute; inset: 0; background: #444;
  border-radius: 13px; cursor: pointer; transition: .3s;
}
.tog .sl::before {
  content: ''; position: absolute; width: 20px; height: 20px;
  left: 3px; bottom: 3px; background: #fff;
  border-radius: 50%; transition: .3s;
}
.tog input:checked + .sl { background: var(--primary); }
.tog input:checked + .sl::before { transform: translateX(24px); }

.rg { margin-top: 14px; }
.rg + .rg { margin-top: 18px; }
.rh { display: flex; justify-content: space-between; align-items: center; }
.rh .rl { font-size: 13px; color: var(--text2); }

.num-input {
  width: 72px; padding: 8px 4px; border: 2px solid var(--border);
  border-radius: 10px; background: var(--surface2); color: var(--text);
  font-size: 20px; font-weight: 700; text-align: center; outline: none;
  -moz-appearance: textfield;
}
.num-input::-webkit-outer-spin-button,
.num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.num-input:focus { border-color: var(--primary); }
.num-input.stop:focus { border-color: var(--accent); }
.num-input.start { color: var(--primary); }
.num-input.stop { color: var(--accent); }
.num-input:disabled { opacity: .4; }
.num-unit { font-size: 16px; font-weight: 600; color: var(--text2); margin-left: 2px; }

.btn {
  display: block; width: 100%; padding: 14px; border: none;
  border-radius: 12px; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: .2s; margin-top: 4px;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:active { background: var(--primary-dark); transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.ninfo {
  margin-top: 8px; padding: 8px 12px; background: var(--surface2);
  border-radius: 8px; font-size: 11px; color: var(--text2);
  word-break: break-all;
}

.toast-el {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--surface); color: var(--text);
  padding: 12px 24px; border-radius: 10px; font-size: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,.5); transition: transform .3s;
  z-index: 100; pointer-events: none;
}
.toast-el.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<select class="lang-sw" id="langSw">
  <option value="en">EN</option>
  <option value="ja">日本語</option>
</select>

<div class="header">
  <h1>⚡ Charging Bypass</h1>
  <div class="sub" data-i18n="subtitle"></div>
</div>

<div class="sbar">
  <div class="sdot" id="sDot"></div>
  <span id="sText" data-i18n="connecting"></span>
</div>

<!-- Status -->
<div class="card">
  <div class="sgrid">
    <div class="sitem" id="cBatt">
      <div class="val" id="vBatt">--%</div>
      <div class="lbl" data-i18n="battery"></div>
    </div>
    <div class="sitem" id="cChg">
      <div class="val" id="vChg">--</div>
      <div class="lbl" data-i18n="charge_status"></div>
    </div>
    <div class="sitem" id="cScr">
      <div class="val" id="vScr">--</div>
      <div class="lbl" data-i18n="screen"></div>
    </div>
    <div class="sitem" id="cByp">
      <div class="val" id="vByp">--</div>
      <div class="lbl" data-i18n="bypass"></div>
    </div>
  </div>
  <div class="bbar"><div class="bfill" id="bFill"></div></div>
  <div class="markers">
    <div class="mk start" id="mkStart" style="left:20%"><span></span></div>
    <div class="mk stop" id="mkStop" style="left:80%"><span></span></div>
  </div>
</div>

<!-- Toggles -->
<div class="card">
  <div class="srow">
    <div>
      <h3 data-i18n="screen_control_title"></h3>
      <p data-i18n="screen_control_desc"></p>
    </div>
    <label class="tog">
      <input type="checkbox" id="optScreen" checked>
      <span class="sl"></span>
    </label>
  </div>
  <div class="srow">
    <div>
      <h3 data-i18n="monitor_title"></h3>
      <p data-i18n="monitor_desc"></p>
    </div>
    <label class="tog">
      <input type="checkbox" id="optMonitor" checked>
      <span class="sl"></span>
    </label>
  </div>
</div>

<!-- Thresholds -->
<div class="card" id="cThresh">
  <div class="rg">
    <div class="rh">
      <span class="rl" data-i18n="charge_start"></span>
      <div><input type="number" class="num-input start" id="rStart" min="5" max="95" value="20" inputmode="numeric"><span class="num-unit">%</span></div>
    </div>
  </div>
  <div class="rg">
    <div class="rh">
      <span class="rl" data-i18n="charge_stop"></span>
      <div><input type="number" class="num-input stop" id="rStop" min="10" max="100" value="80" inputmode="numeric"><span class="num-unit">%</span></div>
    </div>
  </div>
</div>

<button class="btn btn-primary" id="btnSave" data-i18n="save"></button>

<div class="ninfo" id="nodeBox" style="display:none">
  <span data-i18n="node_label"></span> <span id="nodeText">--</span>
</div>

<div class="toast-el" id="toastEl"></div>

<script>
/* ===== i18n ===== */
const I18N = {
  en: {
    subtitle: 'Smart Charging Control',
    connecting: 'Connecting...',
    battery: 'Battery',
    charge_status: 'Charge',
    screen: 'Screen',
    bypass: 'Bypass',
    screen_control_title: '📱 Screen-linked Control',
    screen_control_desc: 'Screen ON → Stop charging / OFF → Resume',
    monitor_title: '🔋 Battery Level Monitor',
    monitor_desc: 'Auto start/stop charging at set levels',
    charge_start: '🟢 Start charging at',
    charge_stop: '🟠 Stop charging at',
    save: '💾 Save Settings',
    saving: '⏳ Saving...',
    save_ok: '✅ Settings saved',
    save_fail: '❌ Save failed: ',
    node_label: 'Charging node:',
    svc_stopped: 'Service not running',
    svc_running: 'Running — ',
    no_api: 'Cannot connect to KernelSU / APatch API',
    mk_start: 'Start ',
    mk_stop: 'Stop ',
    st_charging: 'Charging',
    st_discharging: 'Discharging',
    st_stopped: 'Stopped',
    st_full: 'Full',
    st_unknown: 'Unknown',
  },
  ja: {
    subtitle: 'スマート充電管理',
    connecting: '接続中...',
    battery: 'バッテリー',
    charge_status: '充電状態',
    screen: '画面',
    bypass: 'バイパス',
    screen_control_title: '📱 画面連動制御',
    screen_control_desc: '画面ON→充電停止 / OFF→充電再開',
    monitor_title: '🔋 バッテリー残量監視',
    monitor_desc: '指定残量で充電の開始/停止を自動制御',
    charge_start: '🟢 充電開始残量',
    charge_stop: '🟠 充電停止残量',
    save: '💾 設定を保存',
    saving: '⏳ 保存中...',
    save_ok: '✅ 設定を保存しました',
    save_fail: '❌ 保存失敗: ',
    node_label: '充電制御ノード:',
    svc_stopped: 'サービス未起動',
    svc_running: '動作中 — ',
    no_api: 'KernelSU / APatch API に接続できません',
    mk_start: '開始 ',
    mk_stop: '停止 ',
    st_charging: '充電中',
    st_discharging: '放電中',
    st_stopped: '停止',
    st_full: '満充電',
    st_unknown: '不明',
  }
};

let lang = (navigator.language || '').startsWith('ja') ? 'ja' : 'en';

function t(key) { return (I18N[lang] || I18N.en)[key] || key; }

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.documentElement.lang = lang;
  syncUI();
}

document.getElementById('langSw').value = lang;
document.getElementById('langSw').addEventListener('change', e => {
  lang = e.target.value;
  localStorage.setItem('cb_lang', lang);
  applyI18n();
});
const savedLang = localStorage.getItem('cb_lang');
if (savedLang && I18N[savedLang]) lang = savedLang;

/* ===== API ===== */
const MODDIR = '/data/adb/modules/chargingbypass_miatoll';
const CONF = MODDIR + '/config.conf';
const STATE = MODDIR + '/state.conf';

let _cbId = 0;

function initAPI() {
  // Both KernelSU and APatch inject window.ksu via addJavascriptInterface
  return !!(window.ksu && typeof window.ksu.exec === 'function');
}

function run(cmd) {
  return new Promise(function(resolve) {
    if (!window.ksu || typeof window.ksu.exec !== 'function') {
      resolve({ errno: -1, stdout: '', stderr: 'no api' });
      return;
    }
    var cbName = '__cb_' + (++_cbId) + '_' + Date.now();
    window[cbName] = function(errno, stdout, stderr) {
      delete window[cbName];
      resolve({ errno: errno, stdout: stdout || '', stderr: stderr || '' });
    };
    try {
      window.ksu.exec(cmd, cbName);
    } catch (e) {
      delete window[cbName];
      resolve({ errno: -1, stdout: '', stderr: e.message });
    }
  });
}

function toast(msg) {
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function parseKV(text) {
  const o = {};
  for (const line of text.split('\n')) {
    const i = line.indexOf('=');
    if (i > 0) o[line.substring(0, i).trim()] = line.substring(i + 1).trim();
  }
  return o;
}

/* --- Status --- */
const statusKeyMap = {
  Charging: 'st_charging', Discharging: 'st_discharging',
  'Not charging': 'st_stopped', Full: 'st_full', Unknown: 'st_unknown'
};

async function refreshStatus() {
  const r = await run('cat ' + STATE + ' 2>/dev/null');
  if (r.errno !== 0 || !r.stdout.trim()) {
    setSvc('err', t('svc_stopped'));
    return;
  }
  const s = parseKV(r.stdout);
  const lv = parseInt(s.BATTERY_LEVEL) || 0;
  const st = s.CHARGING_STATUS || 'Unknown';
  const scr = s.SCREEN_STATE || '--';
  const byp = s.BYPASS_ACTIVE === '1';

  document.getElementById('vBatt').textContent = lv + '%';
  document.getElementById('vChg').textContent = t(statusKeyMap[st] || 'st_unknown');
  document.getElementById('vScr').textContent = scr;
  document.getElementById('vByp').textContent = byp ? 'ON' : 'OFF';

  const cChg = document.getElementById('cChg');
  cChg.className = 'sitem';
  if (st === 'Charging') cChg.classList.add('st-charging');
  else if (st === 'Not charging') cChg.classList.add('st-stopped');
  else cChg.classList.add('st-discharging');

  const cByp = document.getElementById('cByp');
  cByp.className = 'sitem';
  if (byp) cByp.classList.add('st-bypass');

  const fill = document.getElementById('bFill');
  fill.style.width = lv + '%';
  fill.style.background = lv <= 20 ? '#f44336' : lv <= 50 ? '#ff9800' : '#4caf50';

  setSvc('ok', t('svc_running') + (s.LAST_UPDATE || ''));
}

function setSvc(type, txt) {
  const dot = document.getElementById('sDot');
  dot.className = 'sdot' + (type === 'err' ? ' err' : '');
  document.getElementById('sText').textContent = txt;
}

/* --- Config --- */
async function loadConfig() {
  const r = await run('cat ' + CONF + ' 2>/dev/null');
  if (r.errno !== 0 || !r.stdout.trim()) return;
  const c = parseKV(r.stdout);

  if (c.SCREEN_CONTROL !== undefined)
    document.getElementById('optScreen').checked = c.SCREEN_CONTROL === '1';
  if (c.BATTERY_MONITOR !== undefined)
    document.getElementById('optMonitor').checked = c.BATTERY_MONITOR === '1';
  if (c.CHARGE_START !== undefined)
    document.getElementById('rStart').value = c.CHARGE_START;
  if (c.CHARGE_STOP !== undefined)
    document.getElementById('rStop').value = c.CHARGE_STOP;
  syncUI();
}

async function saveConfig() {
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = t('saving');

  const sc = document.getElementById('optScreen').checked ? 1 : 0;
  const bm = document.getElementById('optMonitor').checked ? 1 : 0;
  let lo = Math.max(5, Math.min(95, parseInt(document.getElementById('rStart').value) || 20));
  let hi = Math.max(10, Math.min(100, parseInt(document.getElementById('rStop').value) || 80));
  if (lo >= hi) { lo = hi - 5; if (lo < 5) lo = 5; }
  document.getElementById('rStart').value = lo;
  document.getElementById('rStop').value = hi;

  const cmd = "printf '%s\\n' "
    + "'SCREEN_CONTROL=" + sc + "' "
    + "'BATTERY_MONITOR=" + bm + "' "
    + "'CHARGE_START=" + lo + "' "
    + "'CHARGE_STOP=" + hi + "' "
    + "> " + CONF;

  const r = await run(cmd);
  toast(r.errno === 0 ? t('save_ok') : t('save_fail') + r.stderr);

  btn.disabled = false;
  btn.textContent = t('save');
  syncUI();
}

/* --- Node info --- */
async function loadNode() {
  const r = await run('cat ' + MODDIR + '/charging_node 2>/dev/null');
  if (r.errno === 0 && r.stdout.trim()) {
    document.getElementById('nodeText').textContent = r.stdout.trim();
    document.getElementById('nodeBox').style.display = '';
  }
}

/* --- UI sync --- */
function syncUI() {
  const mon = document.getElementById('optMonitor').checked;
  document.getElementById('cThresh').style.opacity = mon ? '1' : '.4';
  document.getElementById('rStart').disabled = !mon;
  document.getElementById('rStop').disabled = !mon;

  const lo = document.getElementById('rStart').value;
  const hi = document.getElementById('rStop').value;
  const mkS = document.getElementById('mkStart');
  const mkP = document.getElementById('mkStop');
  mkS.style.left = lo + '%';
  mkS.querySelector('span').textContent = t('mk_start') + lo + '%';
  mkP.style.left = hi + '%';
  mkP.querySelector('span').textContent = t('mk_stop') + hi + '%';
}

/* --- Events --- */
document.getElementById('rStart').addEventListener('input', syncUI);
document.getElementById('rStop').addEventListener('input', syncUI);
document.getElementById('optMonitor').addEventListener('change', syncUI);
document.getElementById('btnSave').addEventListener('click', saveConfig);

/* --- Init --- */
(async () => {
  applyI18n();
  if (!initAPI()) {
    setSvc('err', t('no_api'));
    return;
  }
  await loadConfig();
  await refreshStatus();
  await loadNode();
  setInterval(refreshStatus, 5000);
})();
</script>
</body>
</html>
